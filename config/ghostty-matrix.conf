# Matrix mode theme for Ghostty. `matrix on` copies this to ~/.config/ghostty/matrix-mode.conf
background = #000402
foreground = #5cff8a
cursor-color = #b6ffc8
cursor-text = #010703
selection-background = #1f6b35
selection-foreground = #e6ffea
palette = 0=#0a1f10
palette = 1=#e0605a
palette = 2=#3dff6e
palette = 3=#e6c35c
palette = 4=#5c9ee0
palette = 5=#c07ae0
palette = 6=#4fd6c8
palette = 7=#a8ffbe
palette = 8=#2f6b42
palette = 9=#ff7a72
palette = 10=#6bff92
palette = 11=#ffd877
palette = 12=#7ab6ff
palette = 13=#d69aff
palette = 14=#7ff0e0
palette = 15=#e6ffea
background-opacity = 0.97
font-thicken = true
font-thicken-strength = 60
custom-shader = ~/.matrix-mode/matrix.glsl
custom-shader-animation = always
window-padding-color = background
macos-titlebar-style = transparent
progress-style = false
